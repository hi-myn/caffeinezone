name: Build e Testes

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore CaffeineZone.slnx

      - name: Build
        run: dotnet build CaffeineZone.slnx --no-restore --configuration Release

      - name: Rodar testes
        run: dotnet test CaffeineZone.slnx --no-build --configuration Release